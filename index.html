<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Blocked</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #ffffff;
        color: #111111;
        font-family: Arial, Helvetica, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        text-align: center;
        max-width: 600px;
        padding: 40px;
    }

    .icon {
        font-size: 72px;
        color: #c62828;
        margin-bottom: 24px;
    }

    h1 {
        font-size: 2rem;
        font-weight: 300;
        margin-bottom: 16px;
        color: #222;
    }

    p {
        font-size: 1rem;
        line-height: 1.6;
        color: #555;
    }

    .reason {
        margin-top: 24px;
        padding: 16px;
        border-left: 4px solid #c62828;
        background: #fafafa;
        color: #444;
        text-align: left;
    }

    .footer {
        margin-top: 32px;
        font-size: 0.85rem;
        color: #888;
    }
</style>
</head>
<body>
    <div class="container">
        <div class="icon">⛔</div>

        <h1>Content Blocked</h1>

        <p>
            Access to this content has been restricted in accordance with
            organizational security and acceptable use policies.
        </p>

        <div class="reason">
            <strong>Reason:</strong><br>
            The requested website or content category is not permitted.
        </div>

        <div class="footer">
            If you believe this page was blocked in error, please contact your administrator.
        </div>
    </div>
</body>
</html>
