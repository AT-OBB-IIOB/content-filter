<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÖBB WiFi – Testbetrieb</title>
<style>
:root{--oebb:#e2001a;--text:#2b2b2b;--muted:#666;--bg:#f5f5f5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{height:68px;background:#fff;border-bottom:4px solid var(--oebb);display:flex;align-items:center;justify-content:space-between;padding:0 6vw}.logo{background:var(--oebb);color:#fff;font-weight:800;font-size:24px;letter-spacing:-1px;padding:8px 13px;border-radius:3px}.languages button{border:0;background:transparent;color:#666;font-weight:700;padding:8px;cursor:pointer}.languages button.active{color:var(--oebb)}
main{flex:1;display:grid;place-items:center;padding:24px}.box{width:min(560px,100%);background:#fff;padding:38px 40px;border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.10);text-align:center}.symbol{margin:0 auto 20px;width:56px;height:56px;border:3px solid var(--oebb);border-radius:50%;display:grid;place-items:center;color:var(--oebb);font-family:Georgia,"Times New Roman",serif;font-weight:bold;font-size:34px;line-height:1}h1{font-size:27px;margin:0 0 16px}p{line-height:1.5;color:var(--muted);margin:10px 0}.details{text-align:left;margin-top:23px;background:#f3f3f3;border-left:4px solid var(--oebb);padding:13px 15px;font-size:14px}.label{font-weight:700;color:#333}.value{overflow-wrap:anywhere;margin-top:4px}.note{margin-top:10px}
footer{text-align:center;color:#888;font-size:12px;padding:16px}@media(max-width:600px){header{height:60px;padding:0 16px}.logo{font-size:21px;padding:7px 11px}.box{padding:28px 20px;box-shadow:none;background:transparent}h1{font-size:23px}.symbol{width:50px;height:50px;font-size:30px}}
</style>
</head><body>
<header><div class="logo" aria-label="ÖBB">ÖBB</div><div class="languages"><button id="deBtn" class="active" onclick="setLang('de')">DE</button><button id="enBtn" onclick="setLang('en')">EN</button></div></header>
<main><section class="box"><div class="symbol" aria-hidden="true">i</div><h1 id="title"></h1><p id="message"></p><div class="details"><div class="label" id="statusLabel"></div><div class="value" id="status"></div><div class="note"><span class="label" id="noteLabel"></span><div class="value" id="note"></div></div></div></section></main>
<footer>ÖBB WiFi</footer>
<script>
const text={de:{title:'ÖBB WiFi – Testbetrieb',message:'Dieser Dienst gehört zum ÖBB WLAN im Zug und wird derzeit ausschließlich zu Testzwecken betrieben.',statusLabel:'Status',status:'Testbetrieb',noteLabel:'Hinweis',note:'Während des Testbetriebs können Verfügbarkeit, Geschwindigkeit und Funktionsumfang jederzeit und ohne Vorankündigung eingeschränkt sein oder sich ändern.'},en:{title:'ÖBB WiFi – test operation',message:'This service belongs to the ÖBB WiFi on board the train and is currently operated for testing purposes only.',statusLabel:'Status',status:'Test operation',noteLabel:'Please note',note:'During test operation, availability, speed and the range of functions may be limited or may change at any time without prior notice.'}};
function setLang(l){document.documentElement.lang=l;document.title=text[l].title;for(const k of ['title','message','statusLabel','status','noteLabel','note'])document.getElementById(k).textContent=text[l][k];deBtn.classList.toggle('active',l==='de');enBtn.classList.toggle('active',l==='en')}
setLang('de');
</script>
</body></html>
